- aid: workstream:workstream-authorization-api
  name: Workstream Authorization API
  description: >-
    The Workstream API uses OAuth 2.0 Bearer access tokens to authenticate requests. You can view and
    manage your access tokens in the [Workstream Dashboard](https://hr.workstream.us/#/company?currentPanel=integrations&integrationItem=accesstoken).


    To generate an access token, simply click on `Generate token`, give it a name, and select the permissions(i.e.
    Applicants, Employees, Positions) to attach to it. **The token expires in 7 days.**


    You can also manage your tokens through API, as shown in the next section.
  humanURL: https://docs.workstream.us/
  baseURL: https://public-api.workstream.us
