aid: workstream
name: Workstream
description: 'Workstream is an all-in-one HR, hiring, and payroll platform built for
  hourly businesses, particularly multi-location restaurants, serving 46 of the top
  50 restaurant brands including Taco Bell, Jimmy John''s, and Culver''s. The platform
  covers applicant tracking and sourcing, Voice AI screening, onboarding, team management,
  time and scheduling, compliance, and full-service payroll. Workstream publishes
  a public REST API (OAuth 2.0 access tokens scoped to positions, applicants, employees,
  locations, departments, and custom fields) documented at docs.workstream.us.'
